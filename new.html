<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .show{
            color:green;
        }
        .hide{
            color:red;
        }
    </style>
</head>
<body>
    <button id="show">Show</button>
    <label id="showlabel"></label>
    <script>
        var boolean;
        const button=document.getElementById('show');
        const label=document.getElementById('showlabel');
        button.addEventListener('click',function(){
            boolean=!boolean;
            label.textContent=`${boolean?"Label is visible":"Label is hidden"}`;
            label.className= `${boolean?"show":"hide"}`;
        })

    </script>
</body>
</html>
